# Les valeurs par défaut correspondent au conteneur PostgreSQL de
# docker-compose.yml ; les variables d'environnement les remplacent.
spring:
  application:
    name: moteur-recherche
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moteur}
    username: ${DB_USER:moteur}
    password: ${DB_PASSWORD:moteur}

server:
  # toutes les interfaces : les téléphones du réseau local doivent pouvoir se connecter
  address: 0.0.0.0
  port: ${PORT:8080}
