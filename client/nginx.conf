server {
    listen 80;
    root /usr/share/nginx/html;

    # l'API est servie par Spring Boot, joignable par son nom de service
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # la RegEx sur le texte intégral peut être longue
        proxy_read_timeout 300s;
    }

    # routes du client : le routage se fait dans le navigateur, nginx renvoie
    # index.html. On les liste une à une pour garder les 404 ailleurs.
    location ~ ^/books/[0-9]+$ {
        try_files /index.html =404;
    }

    # fichiers produits par Vite : leur nom contient un hash, on peut les garder en cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
