# Application complète : docker compose up --build, puis http://localhost:8080
# En développement local, seule la base tourne dans Docker : make db
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: engine
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
    ports:
      # en local seulement, pour make run hors de Docker
      - "127.0.0.1:5432:5432"
    volumes:
      # depuis PostgreSQL 18, les données vont dans /var/lib/postgresql/18/docker
      - data:/var/lib/postgresql
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 2s
      timeout: 5s
      retries: 30

  # docker compose run --rm server corpus --limit=50 (puis index, graph)
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/engine
      DB_USER: engine
      DB_PASSWORD: engine
    volumes:
      # textes des livres : écrits par l'étape corpus, lus par la RegEx sur le texte
      - books:/app/data
      # liste des livres du corpus, écrite par l'étape corpus et versionnée dans le dépôt
      - ./corpus:/app/corpus
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy

  client:
    build: client
    ports:
      - "8080:80"
    networks:
      - front
    depends_on:
      - server

# Le client ne voit que le serveur, la base ne voit que le serveur
networks:
  front:
  back:

volumes:
  data:
  books:
